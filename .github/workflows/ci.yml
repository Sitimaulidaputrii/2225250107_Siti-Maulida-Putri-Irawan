name: CI

on:
  push:
  pull_request:

jobs:
  backend-dan-konten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang dependensi
        run: pip install -r backend/requirements-dev.txt
      - name: Uji backend
        working-directory: backend
        run: pytest -q
      - name: Validasi bank soal
        run: python tools/validasi_soal.py "frontend/public/konten/soal-*.json"

  periksa-silang-js-python:
    # Soal acak dari mesin JavaScript harus disetujui SymPy (kunci & setiap langkah).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - run: pip install -r backend/requirements-dev.txt
      - run: node tools/ekspor_soal_acak.mjs silang 100
      - run: python tools/validasi_soal.py "silang/soal-acak-*.json"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
